<ModalStack
  dismissEnabled="true"
  [class]="'modal-root ' + (isDarkTheme ? 'theme-dark' : 'theme-light')"
  (loaded)="onRootLoaded()">
  <GridLayout rows="*" columns="*">
    <StackLayout row="0" col="0" class="backdrop" (tap)="closeWithoutSave()"></StackLayout>

    <GridLayout row="0" col="0" rows="auto,*" class="modal-card">
      <GridLayout row="0" columns="*,auto" class="header header-fixed">
        <Label
          col="0"
          [text]="'Job History (' + jobHistoryList.length + ')'"
          class="title modal-title-text"></Label>

        <StackLayout col="1">
          <MenuButton
            [useSFIcon]="true"
            style="background-color: transparent; height: 24; width: 35;"
            [sfIconName]="'ellipsis.circle'"
            [showSpinner]="isRefreshingMainMenu"
            [options]="mainMenuOptions"
            (selected)="onSelectedMainMenu($event)">
          </MenuButton>
        </StackLayout>
      </GridLayout>

      <GridLayout row="1" rows="auto,*,auto" class="history-list-wrap">
        <StackLayout row="0" class="history-summary">
          <Label class="history-job-title" [text]="job?.jobDescription || 'Job'"></Label>
          <Label class="history-job-meta" [text]="'Account#: ' + (job?.accountNumber || 'n/a')"></Label>
          <Label class="history-job-meta" [text]="'WO#: ' + (job?.workOrderNumber || 'n/a')"></Label>
        </StackLayout>

        <GridLayout row="1">
          <ActivityIndicator
            *ngIf="isLoading"
            [busy]="isLoading"
            class="loading-indicator">
          </ActivityIndicator>

          <StackLayout *ngIf="!isLoading && loadError" class="empty-state">
            <Label class="empty-message" [text]="loadError"></Label>
          </StackLayout>

          <StackLayout *ngIf="!isLoading && !loadError && !jobHistoryList.length" class="empty-state">
            <Label class="empty-message" text="No history found for this job."></Label>
          </StackLayout>

          <RadListView
            *ngIf="!isLoading && jobHistoryList.length"
            [items]="jobHistoryList"
            selectionBehavior="None"
            class="custom-types-list">
            <ng-template tkListItemTemplate let-item="item">
              <GridLayout rows="auto" columns="*"
                style="margin-left: 10; margin-right: 10; margin-top: 6; margin-bottom: 6;">
                <StackLayout class="item-bag history-card">
                  <GridLayout columns="*,auto" class="history-card-header">
                    <Label col="0" class="history-card-title" [text]="getHistoryTitle(item)"></Label>
                    <Label
                      col="1"
                      class="history-status"
                      [class.status-closed]="itemStatusClass(item) === 'status-closed'"
                      [class.status-open]="itemStatusClass(item) === 'status-open'"
                      [class.status-default]="itemStatusClass(item) === 'status-default'"
                      [text]="getHistoryStatus(item)">
                    </Label>
                  </GridLayout>

                  <Label *ngIf="getHistoryAmount(item)" class="history-amount" [text]="getHistoryAmount(item)"></Label>
                  <Label class="history-date" [text]="getHistoryDate(item)"></Label>
                  <Label *ngIf="getHistoryAddress(item)" class="history-address" [text]="getHistoryAddress(item)"></Label>
                  <Label class="history-meta" [text]="'Job#: ' + (item?.number || job?.number || 'n/a')"></Label>
                  <Label *ngIf="item?.notes" class="history-notes" [text]="item.notes"></Label>
                </StackLayout>
              </GridLayout>
            </ng-template>
          </RadListView>
        </GridLayout>

        <GridLayout row="2" columns="*" class="footer-row">
          <Button text="Close" class="close-button" (tap)="closeWithoutSave()"></Button>
        </GridLayout>
      </GridLayout>
    </GridLayout>
  </GridLayout>
</ModalStack>
