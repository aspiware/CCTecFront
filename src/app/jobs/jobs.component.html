<ActionBar class="action-bar" title="Jobs History">
  <ActionItem ios.position="right" ios.systemIcon="13" [visibility]="isSyncing ? 'collapse' : 'visible'"
    [isEnabled]="!isSyncing" (tap)="refreshJobs()">
  </ActionItem>
  <ActionItem ios.position="right" [visibility]="isSyncing ? 'visible' : 'collapse'">
    <ActivityIndicator [busy]="isSyncing" width="20" height="20"></ActivityIndicator>
  </ActionItem>
</ActionBar>

<StackLayout class="container">
  <GridLayout columns="*,*,auto" class="filters-row">
    <StackLayout col="0" class="filter-card">
      <Label text="Start Date" class="filter-label"></Label>
      <DatePicker [date]="startDate" (dateChange)="onStartDateChange($event)"></DatePicker>
    </StackLayout>

    <StackLayout col="1" class="filter-card">
      <Label text="End Date" class="filter-label"></Label>
      <DatePicker [date]="endDate" [maxDate]="todayDate" (dateChange)="onEndDateChange($event)"></DatePicker>
    </StackLayout>

    <StackLayout col="2" class="total-card">
      <Label text="Total" class="filter-label total-label"></Label>
      <Label [text]="totalAmount | currency" class="total-value"></Label>
    </StackLayout>
  </GridLayout>

  <RadListView [items]="jobList" [pullToRefresh]="!isSyncing" (pullToRefreshInitiated)="onPullToRefresh($event)"
    height="100%" class="jobs-list">
    <ng-template tkListItemTemplate let-item="item">
      <GridLayout clipToBounds="false">
        <StackLayout class="item-bag">
          <GridLayout columns="*,auto" width="100%" class="item-header">
            <Label col="0" class="first-row"
              [text]="(item.jobDescription || 'Job') + (item.description ? ' - ' + item.description : '')">
            </Label>
            <Label col="1" class="first-row amount" [text]="(item.amount || 0) | currency"></Label>
          </GridLayout>

          <Label class="second-row"
            [text]="(item.address || '') + ', ' + (item.city || '') + ', ' + (item.state || '') + ' ' + fiveDigitZip(item.zipcode)">
          </Label>

          <GridLayout rows="auto" columns="auto, *, auto" class="meta-row">
            <Label col="0" class="secondRow" [text]="'Job#: ' + (item.number || 'n/a')" style="margin-right: 10;"></Label>
            <Label col="1" class="secondRow" [text]="'Account#: ' + (item.accountNumber || 'n/a')"></Label>
            <Label col="2" class="secondRow units" [text]="'Units: ' + (item.jobUnits || 'n/a')"></Label>
          </GridLayout>

          <GridLayout columns="*,auto" style="margin-bottom: 10;">
            <Label col="0" class="second-row"
              [text]="(item.timeSlotStartDateTime | date: 'MMM d, y h:mm a') + ' - ' + (item.timeSlotEndDateTime | date: 'h:mm a')">
            </Label>
            <Label col="1" *ngIf="item.sms_survey_sent" class="fas survey-icon" text="&#xf7cd;"></Label>
          </GridLayout>
        </StackLayout>

        <Label class="fas status-icon floating-status {{ itemStatusClass(item) }}" [text]="itemStatusIcon(item)"></Label>
      </GridLayout>
    </ng-template>
  </RadListView>
</StackLayout>
