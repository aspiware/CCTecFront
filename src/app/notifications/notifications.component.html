<ModalStack dismissEnabled="false" class="modal-root">
  <GridLayout rows="*" columns="*">
    <StackLayout row="0" col="0" class="backdrop"></StackLayout>

    <GridLayout row="0" col="0" rows="auto,auto" class="modal-card">
      <GridLayout row="0" columns="*,auto" class="header header-fixed">
        <Label col="0" text="Notifications" class="title modal-title-text"></Label>

        <Label
          col="1"
          text="Close"
          class="close-text"
          (tap)="closeModal()">
        </Label>
      </GridLayout>

      <StackLayout row="1" class="card">
        <GridLayout columns="*, auto" class="data-row">
          <Label col="0" text="Title" class="label-key"></Label>
          <Label col="1" [text]="notification?.title || notification?.name || '-'" class="label-value" textAlignment="right"></Label>
        </GridLayout>

        <GridLayout columns="*, auto" class="line-row data-row">
          <Label col="0" text="Message" class="label-key"></Label>
          <Label col="1" [text]="notification?.message || notification?.description || '-'" class="label-value" textAlignment="right"></Label>
        </GridLayout>

        <GridLayout columns="*, auto" class="line-row data-row">
          <Label col="0" text="Count" class="label-key"></Label>
          <Label col="1" [text]="notifications.length ? (notifications.length | number:'1.0-0') : '0'" class="label-value" textAlignment="right"></Label>
        </GridLayout>
      </StackLayout>
    </GridLayout>
  </GridLayout>
</ModalStack>
