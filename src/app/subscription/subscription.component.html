<ActionBar class="action-bar" title="Subscription"></ActionBar>

<GridLayout rows="*" class="page">
  <!-- <GridLayout class="bg-layer"></GridLayout> -->

  <ScrollView>
    <StackLayout class="content-wrap">
      <StackLayout class="plan-card">
        <Label text="Basic" class="plan-title"></Label>
        <Label text="Full access to all CCTec standard features." class="plan-subtitle"></Label>

        <GridLayout columns="auto,auto" class="price-row">
          <Label col="0" text="$9.99" class="price-main"></Label>
          <StackLayout col="1" verticalAlignment="middle">
            <Label text="" class="save-pill"></Label>
            <Label text="USD / month" class="price-unit"></Label>
          </StackLayout>
        </GridLayout>

        <Label [text]="message" class="message message-in-card"></Label>

        <Button
          [text]="isBusy ? 'Please wait...' : 'SUBSCRIBE'"
          class="subscribe-btn"
          [isEnabled]="!isBusy"
          (tap)="onSubscribe()">
        </Button>

        <Button
          text="Restore Purchase"
          class="restore-btn"
          [isEnabled]="!isBusy"
          (tap)="onRestore()">
        </Button>

        <StackLayout class="features-list">
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="All illustration styles" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Unlimited templates" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Unlimited mockups" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="JPG, PNG and SVG downloads" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="SVG animations" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Everything included in Basic" class="feature-text"></Label>
          </GridLayout>
        </StackLayout>
      </StackLayout>
    </StackLayout>
  </ScrollView>
</GridLayout>
