<ActionBar class="action-bar" title="Subscription">
</ActionBar>

<GridLayout rows="*" [class]="'page ' + (isDarkTheme ? 'theme-dark' : 'theme-light')" (loaded)="onRootLoaded()">
  <!-- <GridLayout class="bg-layer"></GridLayout> -->

  <ScrollView>
    <StackLayout class="content-wrap">
      <StackLayout class="plan-card">
        <Label [text]="isEzeeFiber ? 'Ezee Fiber' : 'Basic'" class="plan-title"></Label>
        <Label text="Track your work and real earnings in one place." class="plan-subtitle"></Label>

        <GridLayout *ngIf="!isEzeeFiber" columns="auto,auto" class="price-row">
          <Label col="0" text="$9.99" class="price-main"></Label>
          <StackLayout col="1" verticalAlignment="middle">
            <Label text="/ month" class="price-unit"></Label>
          </StackLayout>
        </GridLayout>

        <Label *ngIf="!isEzeeFiber" text="Auto-renewable subscription" class="billing-note"></Label>

        <Label *ngIf="!isEzeeFiber" text="7-day free trial • Cancel anytime" class="message message-in-card"></Label>
        <Label *ngIf="isEzeeFiber && canShowStripeCheckout" text="See the price and billing terms in Stripe Checkout."
          textWrap="true" class="billing-note"></Label>

        <Button
          *ngIf="!isEzeeFiber || canShowStripeCheckout"
          [text]="isBusy ? 'Please wait...' : (isEzeeFiber ? 'Continue to Stripe' : 'SUBSCRIBE')"
          class="subscribe-btn"
          [isEnabled]="!isBusy && !isCheckingStripe"
          (tap)="onSubscribe()">
        </Button>

        <Button
          [text]="isEzeeFiber ? 'Check Subscription' : 'Restore Purchase'"
          class="restore-btn"
          [isEnabled]="!isBusy && !isCheckingStripe"
          (tap)="onRestore()">
        </Button>

        <StackLayout orientation="horizontal" horizontalAlignment="center" class="legal-links">
          <Label text="Privacy Policy" class="legal-link" (tap)="openPrivacyPolicy()"></Label>
          <Label *ngIf="!isEzeeFiber" text=" | " class="legal-links-separator"></Label>
          <Label *ngIf="!isEzeeFiber" text="Terms of Use" class="legal-link" (tap)="openTermsOfService()"></Label>
        </StackLayout>

        <StackLayout class="features-list">
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Real-time earnings tracking" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Daily and weekly earnings summary" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Automatic job income calculation" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Smart custom job pricing" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Full job and equipment management" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Automated SMS survey" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Complete job history with notes" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Job status workflow tracking" class="feature-text"></Label>
          </GridLayout>
          <GridLayout columns="auto,*" class="feature-row">
            <Label col="0" text="✓" class="feature-check"></Label>
            <Label col="1" text="Track expenses and real profit" class="feature-text"></Label>
          </GridLayout>
        </StackLayout>
      </StackLayout>
    </StackLayout>
  </ScrollView>
</GridLayout>
