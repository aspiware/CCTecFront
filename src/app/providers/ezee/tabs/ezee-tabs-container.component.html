<TabView #mainTabs
  selectedIndex="1"
  iosIconRenderingMode="alwaysTemplate"
  [tabTextFontSize]="11">
  <GridLayout *tabItem="{ title: 'Summary', iconSource: 'sys://house.fill' }">
    <page-router-outlet name="ezeeHomeTab"></page-router-outlet>
  </GridLayout>

  <GridLayout *tabItem="{ title: 'Today', iconSource: 'sys://clock.badge.checkmark.fill' }">
    <page-router-outlet name="ezeeOrdersTab"></page-router-outlet>
  </GridLayout>

  <GridLayout *tabItem="{ title: 'Settings', iconSource: 'sys://gearshape.fill' }">
    <page-router-outlet name="ezeeSettingsTab"></page-router-outlet>
  </GridLayout>
</TabView>
