<ModalStack dismissEnabled="true" class="modal-root">
  <GridLayout rows="*" columns="*">
    <StackLayout row="0" col="0" class="backdrop" (tap)="close()"></StackLayout>

    <GridLayout row="0" col="0" rows="auto,*,auto" class="modal-card">
      <GridLayout row="0" columns="*,auto" class="header">
        <StackLayout col="0">
          <Label [text]="isAddingEquipment ? 'Add Equipment' : (swappingEquipment ? 'Swap Equipment' : 'Order Equipment')" class="modal-title"></Label>
          <Label [text]="'Order #' + order.number" class="order-number"></Label>
        </StackLayout>
        <Label col="1" [text]="isAddingEquipment || swappingEquipment ? '&#xf060;' : '&#xf00d;'" class="fas close-button" (tap)="close()"></Label>
      </GridLayout>

      <GridLayout *ngIf="!isAddingEquipment && !swappingEquipment" row="1" rows="*" columns="*">
        <StackLayout *ngIf="isLoading" verticalAlignment="middle" horizontalAlignment="center">
          <ActivityIndicator [busy]="true" width="32" height="32"></ActivityIndicator>
          <Label text="Loading equipment..." class="state-message"></Label>
        </StackLayout>

        <StackLayout *ngIf="!isLoading && errorMessage" verticalAlignment="middle">
          <Label text="&#xf071;" class="fas error-icon"></Label>
          <Label [text]="errorMessage" textWrap="true" class="state-message"></Label>
          <Button text="Try Again" class="retry-button" (tap)="retry()"></Button>
        </StackLayout>

        <Label
          *ngIf="!isLoading && !errorMessage && !equipment.length"
          text="No equipment was found for this order."
          textWrap="true"
          class="state-message"
          verticalAlignment="middle">
        </Label>

        <ScrollView *ngIf="!isLoading && !errorMessage && equipment.length">
          <StackLayout>
            <GridLayout
              *ngFor="let item of equipment"
              rows="auto,auto,auto,auto,auto"
              columns="auto,*"
              class="equipment-card">
              <Label row="0" col="0" text="Model" class="field-label"></Label>
              <Label row="0" col="1" [text]="item.model || '—'" textWrap="true" class="field-value model"></Label>

              <Label row="1" col="0" text="Serial" class="field-label"></Label>
              <Label row="1" col="1" [text]="item.serial || '—'" textWrap="true" class="field-value"></Label>

              <Label row="2" col="0" text="ID" class="field-label"></Label>
              <Label row="2" col="1" [text]="item.id || '—'" textWrap="true" class="field-value"></Label>

              <Label row="3" col="0" text="Action" class="field-label"></Label>
              <Label row="3" col="1" [text]="item.action || '—'" textWrap="true" class="field-value action"></Label>

              <Button
                row="4"
                col="0"
                colSpan="2"
                text="Swap Equipment"
                class="swap-button"
                (tap)="openSwapEquipment(item)">
              </Button>
            </GridLayout>
          </StackLayout>
        </ScrollView>
      </GridLayout>

      <ScrollView *ngIf="isAddingEquipment" row="1" class="equipment-form-scroll">
        <StackLayout class="equipment-form">
          <Label text="Scan the serial code or enter it manually." textWrap="true" class="form-instructions"></Label>

          <Label text="Serial" class="input-label"></Label>
          <GridLayout columns="*,auto" class="input-row">
            <TextField col="0" [(ngModel)]="newEquipment.serial" hint="Equipment serial" class="equipment-input"></TextField>
            <Button col="1" text="Scan" class="scan-button" (tap)="scanSerial()"></Button>
          </GridLayout>
        </StackLayout>
      </ScrollView>

      <ScrollView *ngIf="swappingEquipment" row="1" class="equipment-form-scroll">
        <StackLayout class="equipment-form">
          <Label text="Replace the selected equipment with a new unit." textWrap="true" class="form-instructions"></Label>

          <StackLayout class="selected-equipment">
            <Label text="CURRENT EQUIPMENT" class="selected-equipment-title"></Label>
            <Label [text]="swappingEquipment.model || 'Unknown model'" textWrap="true" class="selected-equipment-model"></Label>
            <Label [text]="'ID: ' + swappingEquipment.id" textWrap="true" class="selected-equipment-detail"></Label>
            <Label [text]="'Serial: ' + (swappingEquipment.serial || '—')" textWrap="true" class="selected-equipment-detail"></Label>
          </StackLayout>

          <Label text="New equipment ID" class="input-label"></Label>
          <GridLayout columns="*,auto" class="input-row">
            <TextField col="0" [(ngModel)]="replacementEquipment.id" hint="Replacement equipment ID" class="equipment-input"></TextField>
            <Button col="1" text="Scan" class="scan-button" (tap)="scanReplacementId()"></Button>
          </GridLayout>

          <Label
            *ngIf="replacementEquipment.id.trim() === swappingEquipment.id.trim()"
            text="The replacement must be different from the current equipment."
            textWrap="true"
            class="validation-message">
          </Label>
        </StackLayout>
      </ScrollView>

      <GridLayout *ngIf="!isAddingEquipment && !swappingEquipment" row="2" columns="*" class="footer">
        <Button text="Add Equipment" class="primary-button" (tap)="openAddEquipment()"></Button>
      </GridLayout>

      <GridLayout *ngIf="swappingEquipment" row="2" columns="*,*" class="footer">
        <Button col="0" text="Cancel" class="secondary-button footer-button" (tap)="close()"></Button>
        <Button
          col="1"
          [text]="isSavingEquipment ? 'Swapping...' : 'Swap'"
          class="primary-button footer-button"
          [isEnabled]="canSwapEquipment() && !isSavingEquipment"
          (tap)="saveSwap()">
        </Button>
      </GridLayout>

      <GridLayout *ngIf="isAddingEquipment" row="2" columns="*,*" class="footer">
        <Button col="0" text="Cancel" class="secondary-button footer-button" (tap)="close()"></Button>
        <Button
          col="1"
          [text]="isSavingEquipment ? 'Adding...' : 'Add'"
          class="primary-button footer-button"
          [isEnabled]="canAddEquipment() && !isSavingEquipment"
          (tap)="saveEquipment()">
        </Button>
      </GridLayout>
    </GridLayout>
  </GridLayout>
</ModalStack>
