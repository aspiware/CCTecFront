<ModalStack class="scanner-root">
  <GridLayout rows="auto,*" columns="*" class="scanner-page">
    <GridLayout row="0" columns="auto,*" class="scanner-header">
      <Label col="0" text="&#xf00d;" class="fas close-button" (tap)="cancel()"></Label>
      <StackLayout col="1">
        <Label text="Scan Equipment" class="scanner-title"></Label>
        <Label [text]="autoFindEquipmentId ? 'Point the camera at the DSN or FSAN barcode' : ('Point the camera at the ' + fieldLabel + ' code')" class="scanner-subtitle"></Label>
      </StackLayout>
    </GridLayout>

    <GridLayout row="1" rows="*" columns="*" class="camera-container">
      <MLKitView
        row="0"
        col="0"
        [cameraPosition]="cameraPosition"
        [detectionType]="detectionType"
        [barcodeFormats]="barcodeFormats"
        [processEveryNthFrame]="3"
        aspectRatio="aspectFill"
        (loaded)="onScannerLoaded($event)"
        (detection)="onDetection($event)">
      </MLKitView>

      <GridLayout *ngIf="!permissionError" row="0" col="0" rows="*,220,auto,*" columns="*,300,*" class="scanner-overlay">
        <StackLayout row="1" col="1" class="scan-frame"></StackLayout>
        <StackLayout row="2" col="0" colSpan="3" class="scanner-controls">
          <Label [text]="autoFindEquipmentId ? 'Hold the DSN or FSAN code inside the frame' : 'Hold the code inside the frame'" class="scan-hint"></Label>
          <GridLayout columns="*,auto,auto,auto,*" verticalAlignment="middle" class="auto-find-row">
            <Label col="1" text="Auto Find DSN / FSAN" verticalAlignment="middle" class="auto-find-label"></Label>
            <Label col="2" [text]="autoFindEquipmentId ? 'Yes' : 'No'" verticalAlignment="middle" class="auto-find-value"></Label>
            <Switch col="3" [checked]="autoFindEquipmentId" verticalAlignment="middle" (checkedChange)="onAutoFindEquipmentIdChanged($event)"></Switch>
          </GridLayout>
          <Label
            [text]="autoFindEquipmentId && detectedCode ? ('Detected: ' + detectedCode + ' — looking for DSN / FSAN') : ' '"
            textWrap="true"
            class="detected-hint">
          </Label>
          <Button
            [text]="isTorchOn ? 'Turn Light Off' : 'Turn Light On'"
            [isEnabled]="isScannerReady"
            [class.torch-active]="isTorchOn"
            class="torch-button"
            (tap)="toggleTorch()">
          </Button>
        </StackLayout>
      </GridLayout>

      <StackLayout *ngIf="permissionError" row="0" col="0" class="error-panel" verticalAlignment="middle">
        <Label text="&#xf071;" class="fas error-icon"></Label>
        <Label [text]="permissionError" textWrap="true" class="error-message"></Label>
        <Button text="Close" class="close-error-button" (tap)="cancel()"></Button>
      </StackLayout>
    </GridLayout>
  </GridLayout>
</ModalStack>
