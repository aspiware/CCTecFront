<ModalStack dismissEnabled="true" class="photos-modal">
  <GridLayout rows="auto,*,auto" class="photos-page">
    <GridLayout row="0" columns="*,auto,auto" class="photos-header">
      <StackLayout col="0">
        <Label text="Order Photos" class="photos-title"></Label>
        <Label [text]="'Order #' + order.number + ' · ' + photos.length + ' photos'" class="photos-subtitle"></Label>
        <Label [text]="order.address || 'Address unavailable'" textWrap="true" class="photos-address"></Label>
      </StackLayout>
      <Button col="1" [text]="selectedCount === photos.length && photos.length ? 'Clear' : 'Select All'"
        class="header-button" (tap)="toggleSelectAll()"></Button>
      <Label col="2" text="&#xf00d;" class="fas close-button" (tap)="close()"></Label>
    </GridLayout>

    <GridLayout row="1" rows="auto,*">
      <GridLayout row="0" columns="*,auto" class="screenshot-option">
        <StackLayout col="0" verticalAlignment="middle">
          <Label text="Include Order Screenshot" class="screenshot-title"></Label>
          <Label [text]="isGeneratingScreenshot ? 'Updating screenshot...' : (hasOrderScreenshot ? 'Saved with this order · disable to remove' : 'Enable to generate and save')"
            class="screenshot-subtitle"></Label>
        </StackLayout>
        <Switch col="1" [checked]="includeOrderScreenshot" [isEnabled]="!isGeneratingScreenshot"
          (checkedChange)="onIncludeScreenshotChanged($event)" verticalAlignment="middle"></Switch>
      </GridLayout>

      <StackLayout row="1" *ngIf="!photos.length" verticalAlignment="middle" horizontalAlignment="center">
        <Label text="&#xf03e;" class="fas empty-icon"></Label>
        <Label text="No photos saved for this order." class="empty-text"></Label>
      </StackLayout>

      <ScrollView row="1" *ngIf="photos.length">
        <WrapLayout orientation="horizontal" class="photos-grid">
          <GridLayout *ngFor="let photo of photos" rows="*" columns="*"
            [width]="photoCellSize" [height]="photoCellSize" class="photo-cell">
            <Image row="0" col="0" [src]="photo.path" stretch="aspectFill" class="photo-thumbnail"
              (tap)="openPreview(photo)"></Image>
            <Label row="0" col="0" horizontalAlignment="right" verticalAlignment="top"
              [text]="isSelected(photo) ? '&#xf058;' : '&#xf111;'"
              [class]="'fas selection-button ' + (isSelected(photo) ? 'selected' : '')"
              (tap)="toggleSelection(photo)"></Label>
            <Label *ngIf="photo.kind === 'screenshot'" row="0" col="0"
              horizontalAlignment="left" verticalAlignment="bottom" text="ORDER"
              class="photo-kind-badge"></Label>
          </GridLayout>
        </WrapLayout>
      </ScrollView>
    </GridLayout>

    <GridLayout row="2" columns="*,*" class="photos-footer">
      <MenuButton col="0" [text]="isDeleting ? 'Deleting...' : 'Delete Selected'"
        class="delete-button" [isEnabled]="!!selectedCount && !isDeleting"
        [isRightSide]="true" [options]="deleteMenu.options"
        (selected)="onDeleteMenuSelected($event)">
      </MenuButton>
      <Button col="1" class="share-button"
        [text]="isGeneratingScreenshot ? 'Generating...' : (selectedCount ? 'Share Selected' : (photos.length ? 'Share All' : 'Share Screenshot'))"
        [isEnabled]="(!!photos.length || includeOrderScreenshot) && !isDeleting && !isGeneratingScreenshot"
        (tap)="share()"></Button>
    </GridLayout>

    <GridLayout *ngIf="previewPhoto" row="0" rowSpan="3" class="preview-overlay"
      (pan)="onPreviewPan($event)">
      <Image #previousPreviewImage [src]="previousPreviewPhoto?.path || ''" stretch="aspectFit"
        class="preview-image" [translateX]="-previewWidth"></Image>
      <Image #previewImage [src]="previewPhoto.path" stretch="aspectFit"
        class="preview-image"></Image>
      <Image #nextPreviewImage [src]="nextPreviewPhoto?.path || ''" stretch="aspectFit"
        class="preview-image" [translateX]="previewWidth"></Image>
      <Label [text]="previewPosition" class="preview-position" horizontalAlignment="center"
        verticalAlignment="bottom"></Label>
      <Label text="&#xf00d;" class="fas preview-close" horizontalAlignment="right"
        verticalAlignment="top" (tap)="closePreview()"></Label>
    </GridLayout>
  </GridLayout>
</ModalStack>
