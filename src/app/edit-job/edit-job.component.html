<ModalStack dismissEnabled="true" class="modal-root">
  <GridLayout rows="*" columns="*">
    <StackLayout row="0" col="0" class="backdrop" (tap)="closeModal()"></StackLayout>

    <GridLayout row="0" col="0" rows="auto,*" class="modal-card">
      <GridLayout row="0" columns="*,auto" class="header header-fixed">
        <Label col="0" text="Edit Job" class="title modal-title-text"></Label>

        <StackLayout col="1">
          <MenuButton
            [useSFIcon]="true"
            style="background-color: transparent; height: 24; width: 35;"
            [sfIconName]="'ellipsis.circle'"
            [showSpinner]="viewReady && isLoading"
            #menuStatus
            [options]="mainMenu.options"
            (selected)="onSelectedMainMenu($event, menuStatus)">
          </MenuButton>
        </StackLayout>
      </GridLayout>

      <ScrollView row="1" class="form-scroll">
      <StackLayout class="content">
        <ActivityIndicator
          [busy]="isLoadingTypes"
          [visibility]="isLoadingTypes ? 'visible' : 'collapse'"
          class="loading-indicator">
        </ActivityIndicator>

        <Label
          [text]="emptyMessage"
          [visibility]="(!isLoadingTypes && emptyMessage) ? 'visible' : 'collapse'"
          class="empty-message">
        </Label>

        <SegmentedBar
          [items]="segmentItems"
          [selectedIndex]="selectedSegmentIndex"
          (selectedIndexChange)="onSegmentChanged($event)"
          [visibility]="isCustomJobTypeSelected ? 'visible' : 'collapse'"
          class="job-segment">
        </SegmentedBar>

        <ListPicker
          [items]="jobTypeLabels"
          [selectedIndex]="selectedTypeIndex"
          (selectedIndexChange)="onTypeChanged($event)"
          class="job-type-picker">
        </ListPicker>

        <app-quantity-stepper
          label="Modems"
          [value]="modemsQty"
          [min]="0"
          [max]="20"
          [step]="1"
          (valueChange)="onModemsChanged($event)"
          class="modems-stepper">
        </app-quantity-stepper>

        <TextView
          hint="Notes"
          [text]="notes"
          (textChange)="onNotesChanged($event.value)"
          (focus)="onNotesFocus()"
          (blur)="onNotesBlur()"
          class="notes-input">
        </TextView>
      </StackLayout>
      </ScrollView>
    </GridLayout>
  </GridLayout>
</ModalStack>
