<ModalStack dismissEnabled="true" class="modal-root">
  <GridLayout rows="*" columns="*">
    <StackLayout row="0" col="0" class="backdrop" (tap)="closeWithoutSave()"></StackLayout>

    <GridLayout row="0" col="0" rows="auto,*" class="modal-card">
      <GridLayout row="0" columns="*,auto,auto" class="header header-fixed">
        <Label col="0" text="Add Note" class="title modal-title-text"></Label>
        
        <StackLayout col="2">
          <MenuButton [useSFIcon]="true" style="background-color: transparent; height: 24; width: 35;"
            [sfIconName]="'ellipsis.circle'" [showSpinner]="viewReady && isLoading" #menuStatus
            [options]="mainMenuOptions" (selected)="onSelectedMainMenu($event, menuStatus)">
          </MenuButton>
        </StackLayout>
      </GridLayout>

      <GridLayout row="1" rows="auto,auto,*" class="modal-body">
        <TextView row="0" hint="Write a note" [text]="noteText" (textChange)="onNoteChanged($event.value)"
          style="height: 100%; width: 100%;" class="notes-input">
        </TextView>
      </GridLayout>
    </GridLayout>


  </GridLayout>
</ModalStack>
