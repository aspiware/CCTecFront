<ActionBar class="action-bar" title="XM PHT Scans"></ActionBar>

<GridLayout
  rows="*"
  [class]="'xm-pht-scans-root ' + (isDarkTheme ? 'theme-dark' : 'theme-light')"
  (loaded)="onRootLoaded()">
  <GridLayout row="0" rows="auto,*,auto">
    <GridLayout row="0" columns="*,100" class="xm-pht-scans-picker-row">
      <StackLayout col="0" class="xm-pht-scans-picker-card xm-pht-scans-picker-card-left">
        <Label text="Scan Location" class="xm-pht-scans-picker-label"></Label>
        <ListPicker
          class="xm-pht-scans-picker"
          [items]="scanLocationList"
          [(ngModel)]="selectedScanLocationIndex">
        </ListPicker>
        <Label
          [text]="selectedScanLocation"
          textWrap="true"
          class="xm-pht-scans-picker-value xm-pht-scans-picker-value-wrap">
        </Label>
      </StackLayout>

      <StackLayout col="1" class="xm-pht-scans-picker-card">
        <Label text="Tap Value" class="xm-pht-scans-picker-label"></Label>
        <ListPicker
          class="xm-pht-scans-picker"
          [items]="tapPortList"
          [(ngModel)]="selectedTapValueIndex">
        </ListPicker>
        <Label [text]="selectedTapValue" class="xm-pht-scans-picker-value"></Label>
      </StackLayout>
    </GridLayout>

    <MapView
      row="1"
      class="xm-pht-scans-map"
      [lat]="mapLat"
      [lng]="mapLng"
      [zoom]="mapZoom"
      (ready)="onMapReady($event)"
      (mapTap)="onMapTap($event)">
    </MapView>

    <GridLayout row="2" rows="auto,auto,auto" columns="*,auto" class="xm-pht-scans-coordinates">
      <StackLayout row="0" col="0" class="xm-pht-scans-coordinate-block">
        <Label text="Latitude" class="xm-pht-scans-coordinate-label"></Label>
        <Label [text]="latitudeText" class="xm-pht-scans-coordinate-value"></Label>
      </StackLayout>

      <Button
        row="0"
        col="1"
        text="Clear"
        class="xm-pht-scans-clear-button"
        (tap)="clearSelectedPoint()">
      </Button>

      <StackLayout row="1" col="0" colSpan="2" class="xm-pht-scans-coordinate-block">
        <Label text="Longitude" class="xm-pht-scans-coordinate-label"></Label>
        <Label [text]="longitudeText" class="xm-pht-scans-coordinate-value"></Label>
      </StackLayout>
    </GridLayout>
  </GridLayout>
</GridLayout>
