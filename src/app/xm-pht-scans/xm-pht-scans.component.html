<ActionBar class="action-bar" title="XM PHT Scans">
  <ActionItem
    ios.position="right"
    [text]="isSending ? 'Sending...' : 'Send'"
    (tap)="sendPHT()">
  </ActionItem>
</ActionBar>

<GridLayout
  rows="*"
  [class]="'xm-pht-scans-root ' + (isDarkTheme ? 'theme-dark' : 'theme-light')"
  (loaded)="onRootLoaded()">
  <GridLayout row="0" rows="auto,auto,*">
    <GridLayout row="0" columns="*,100,100" class="xm-pht-scans-picker-row">
      <StackLayout col="0" class="xm-pht-scans-picker-card xm-pht-scans-picker-card-left">
        <Label text="Scan Location" class="xm-pht-scans-picker-label"></Label>
        <ListPicker
          class="xm-pht-scans-picker"
          [items]="scanLocationList"
          [(ngModel)]="selectedScanLocationIndex">
        </ListPicker>
        <Label
          [text]="selectedScanLocation"
          textWrap="true"
          class="xm-pht-scans-picker-value xm-pht-scans-picker-value-wrap">
        </Label>
      </StackLayout>

      <StackLayout col="1" class="xm-pht-scans-picker-card xm-pht-scans-picker-card-left">
        <Label text="Tap Port" class="xm-pht-scans-picker-label"></Label>
        <ListPicker
          class="xm-pht-scans-picker"
          [items]="tapPortList"
          [(ngModel)]="selectedTapPortIndex">
        </ListPicker>
        <Label [text]="selectedTapPort" class="xm-pht-scans-picker-value"></Label>
      </StackLayout>

      <StackLayout col="2" class="xm-pht-scans-picker-card">
        <Label text="Tap Value" class="xm-pht-scans-picker-label"></Label>
        <ListPicker
          class="xm-pht-scans-picker"
          [items]="tapValueList"
          [(ngModel)]="selectedTapValueIndex">
        </ListPicker>
        <Label [text]="selectedTapValue" class="xm-pht-scans-picker-value"></Label>
      </StackLayout>
    </GridLayout>

    <GridLayout row="1" columns="*,*" class="xm-pht-scans-stepper-row">
      <StackLayout col="0" class="xm-pht-scans-stepper-card xm-pht-scans-stepper-card-left">
        <app-quantity-stepper
          label="Upstream Value"
          [value]="upstreamValue"
          [min]="20"
          [max]="55"
          [step]="1"
          (valueChange)="onUpstreamValueChange($event)">
        </app-quantity-stepper>
      </StackLayout>

      <StackLayout col="1" class="xm-pht-scans-stepper-card">
        <app-quantity-stepper
          label="Downstream Value"
          [value]="downstreamValue"
          [min]="-25"
          [max]="25"
          [step]="1"
          (valueChange)="onDownstreamValueChange($event)">
        </app-quantity-stepper>
      </StackLayout>
    </GridLayout>

    <MapView
      row="2"
      class="xm-pht-scans-map"
      [lat]="mapLat"
      [lng]="mapLng"
      [zoom]="mapZoom"
      (ready)="onMapReady($event)"
      (mapTap)="onMapTap($event)">
    </MapView>
  </GridLayout>
</GridLayout>
