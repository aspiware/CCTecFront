<ActionBar class="action-bar" title="XM PHT Scans"></ActionBar>

<GridLayout
  rows="*"
  [class]="'xm-pht-scans-root ' + (isDarkTheme ? 'theme-dark' : 'theme-light')"
  (loaded)="onRootLoaded()">
  <GridLayout row="0" rows="auto,*">
    <GridLayout row="0" columns="*,100" class="xm-pht-scans-picker-row">
      <StackLayout col="0" class="xm-pht-scans-picker-card xm-pht-scans-picker-card-left">
        <Label text="Scan Location" class="xm-pht-scans-picker-label"></Label>
        <ListPicker
          class="xm-pht-scans-picker"
          [items]="scanLocationList"
          [(ngModel)]="selectedScanLocationIndex">
        </ListPicker>
        <Label
          [text]="selectedScanLocation"
          textWrap="true"
          class="xm-pht-scans-picker-value xm-pht-scans-picker-value-wrap">
        </Label>
      </StackLayout>

      <StackLayout col="1" class="xm-pht-scans-picker-card">
        <Label text="Tap Value" class="xm-pht-scans-picker-label"></Label>
        <ListPicker
          class="xm-pht-scans-picker"
          [items]="tapPortList"
          [(ngModel)]="selectedTapValueIndex">
        </ListPicker>
        <Label [text]="selectedTapValue" class="xm-pht-scans-picker-value"></Label>
      </StackLayout>
    </GridLayout>

    <MapView
      row="1"
      class="xm-pht-scans-map"
      [lat]="mapLat"
      [lng]="mapLng"
      [zoom]="mapZoom"
      (ready)="onMapReady($event)"
      (mapTap)="onMapTap($event)">
    </MapView>
  </GridLayout>
</GridLayout>
