<ActionBar class="action-bar" title="Payroll">
  <ActionItem ios.position="right" [visibility]="isSaveLoading ? 'collapse' : 'visible'">
    <StackLayout>
      <MenuButton
        id="payroll-main-menu-btn"
        style="height: 48; width: 35; padding: 0; margin: 0;"
        [useSFIcon]="true"
        [sfIconName]="'ellipsis.circle'"
        [isRightSide]="true"
        [options]="mainMenuR.options"
        (selected)="onSelectedMainMenuR($event)">
      </MenuButton>
    </StackLayout>
  </ActionItem>
  <ActionItem ios.position="right" [visibility]="isSaveLoading ? 'visible' : 'collapse'">
    <ActivityIndicator [busy]="isSaveLoading" width="20" height="20"></ActivityIndicator>
  </ActionItem>
</ActionBar>

<GridLayout
  rows="*"
  [class]="'container ' + (isDarkTheme ? 'theme-dark' : 'theme-light')"
  (loaded)="onRootLoaded()"
  (tap)="onContainerTap($event)">
  <ScrollView row="0" #pricesScroll id="prices-scroll" [height]="pricesScrollHeight" verticalAlignment="top">
    <StackLayout class="content">
      <StackLayout class="card">
        <GridLayout columns="*,auto">
          <Label col="0" class="item-name" text="Meter Rent Amount"></Label>
          <GridLayout col="1" columns="auto,*" class="input-shell item-input-shell" (tap)="onInputTap()">
            <Label col="0" class="currency-prefix" text="$"></Label>
            <TextField
              col="1"
              class="custom-tf-inline item-price-input"
              keyboardType="decimal"
              hint="0.00"
              [text]="meterRentAmountText"
              (textChange)="onAmountChange('meterRent', $event)"
              (tap)="onInputTap()"
              (focus)="onPriceFocus(0)"
              (blur)="onAmountBlur('meterRent')">
            </TextField>
          </GridLayout>
        </GridLayout>
      </StackLayout>

      <StackLayout class="card section-card">
        <GridLayout columns="*,auto">
          <Label col="0" class="item-name" text="Billing Platform Amount"></Label>
          <GridLayout col="1" columns="auto,*" class="input-shell item-input-shell" (tap)="onInputTap()">
            <Label col="0" class="currency-prefix" text="$"></Label>
            <TextField
              col="1"
              class="custom-tf-inline item-price-input"
              keyboardType="decimal"
              hint="0.00"
              [text]="billingPlatformAmountText"
              (textChange)="onAmountChange('billingPlatform', $event)"
              (tap)="onInputTap()"
              (focus)="onPriceFocus(1)"
              (blur)="onAmountBlur('billingPlatform')">
            </TextField>
          </GridLayout>
        </GridLayout>
      </StackLayout>

      <StackLayout class="card section-card">
        <GridLayout columns="*,160" class="fund-weeks-row">
          <Label col="0" class="item-name" text="Fund Weeks"></Label>
          <app-quantity-stepper
            col="1"
            [value]="fundWeeks"
            [min]="0"
            [max]="52"
            [step]="1"
            (valueChange)="onFundWeeksChanged($event)">
          </app-quantity-stepper>
        </GridLayout>
      </StackLayout>

      <StackLayout class="card section-card">
        <GridLayout columns="*,180" class="fund-weeks-row">
          <Label col="0" class="item-name" text="Pay Day"></Label>
          <ListPicker
            col="1"
            class="payday-picker"
            [items]="weekDays"
            [selectedIndex]="payDay"
            (selectedIndexChange)="onPayDayChanged($event)">
          </ListPicker>
        </GridLayout>
      </StackLayout>
    </StackLayout>
  </ScrollView>
</GridLayout>
